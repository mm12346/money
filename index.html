            <!-- รายจ่ายล่าสุด (ขวา) -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col">
                <h3 class="text-lg font-bold text-slate-800 mb-4">รายการรายจ่ายล่าสุด</h3>
                <div id="dash-recent-expenses" class="space-y-3 overflow-y-auto flex-1 max-h-72">

    <!-- Loading Overlay -->
    <div id="loading-overlay" class="hidden fixed inset-0 z-[110] bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center">
        <div class="spinner mb-4"></div>
        <p class="text-blue-800 font-bold animate-pulse">กำลังซิงค์ข้อมูลกับ Google Sheets...</p>
    </div>

    <script>
        // --- ฝัง URL ของ Google Apps Script ที่นี่ ---
        // ให้แก้ไข URL ด้านล่างนี้เป็น URL จาก Web App ของคุณ (หากยังไม่มีให้เว้นว่างไว้เป็น '')
        const scriptUrl = 'https://script.google.com/macros/s/AKfycbwYpKgaBPz03VppkL7sqLcKH8qda7Wu7P51b1n4oncqOETCQmg44L7CLhs9mIgWZIU/exec'; 

        // ค่าคงที่สำหรับภาษาไทย
        const THAI_MONTHS = [
            'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
            'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
        ];
        const THAI_DAYS_SHORT = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
        const THAI_DAYS_FULL = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];

        // State ของระบบ
        const today = new Date();
        let viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
        let selectedDate = new Date(today.getFullYear(), today.getMonth(), today.getDate());
        let events = {}; // โครงสร้าง: { 'YYYY-MM-DD': [{ id, title, time, income, expense, otHours }] }
        let monthlySalaries = {}; // โครงสร้าง: { 'YYYY-MM': number }
        let showAddEvent = false;

        // Dashboard & Cloud State
        let currentView = 'calendar';
        let chartInstance = null;

        // Helper Functions
        function getDaysInMonth(year, month) {
            return new Date(year, month + 1, 0).getDate();
        }

        function getFirstDayOfMonth(year, month) {
            return new Date(year, month, 1).getDay();
        }

        function formatDateKey(date) {
            const d = new Date(date);
            const month = '' + (d.getMonth() + 1);
            const day = '' + d.getDate();
            const year = d.getFullYear();
            return [year, month.padStart(2, '0'), day.padStart(2, '0')].join('-');
        }

        // --- CLOUD FUNCTIONS (Google Apps Script) ---
        async function syncToCloud() {
            if (!scriptUrl || !scriptUrl.startsWith('http') || scriptUrl.includes('...')) return; // ป้องกันข้อผิดพลาดหากยังเป็น URL จำลองหรือค่าว่าง
            try {
                document.getElementById('loading-overlay').classList.remove('hidden');
                
                // ใช้ Text/Plain ในการส่งเพื่อเลี่ยงปัญหา CORS กับ Google Apps Script
                await fetch(scriptUrl, {
                    method: 'POST',
                    body: JSON.stringify({ events, monthlySalaries }),
                });
            } catch (error) {
                console.error("Cloud Sync Error (อาจเกิดจาก URL ผิดหรือติดปัญหา CORS):", error);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        async function loadFromCloud() {
            if (!scriptUrl || !scriptUrl.startsWith('http') || scriptUrl.includes('...')) return;
            try {
                document.getElementById('loading-overlay').classList.remove('hidden');
                const response = await fetch(scriptUrl);
                const data = await response.json();
                
                if (data.events) events = data.events;
                if (data.monthlySalaries) monthlySalaries = data.monthlySalaries;
                
                updateUI();
            } catch (error) {
                console.error("Cloud Load Error (อาจเกิดจาก URL ผิดหรือติดปัญหา CORS):", error);
            } finally {
                document.getElementById('loading-overlay').classList.add('hidden');
            }
        }

        // Render Functions
        function renderHeader() {
            const daysHeaderContainer = document.getElementById('days-header');
            daysHeaderContainer.innerHTML = THAI_DAYS_SHORT.map((day, index) => `
                <div class="text-center font-bold text-sm py-2 ${index === 0 || index === 6 ? 'text-red-500' : 'text-slate-500'}">
                    ${day}
                </div>
            `).join('');
        }

        function renderCalendar() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            
            // 1. คำนวณสรุปยอดประจำเดือน (รายรับ, รายจ่าย)
            let monthlyIncome = 0;
            let monthlyExpense = 0;
            let monthlyOtHours = 0;
            const currentMonthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            
            const monthlySalary = monthlySalaries[currentMonthPrefix] || 0;
            const daysInMonth = getDaysInMonth(year, month);
            const dailySalary = monthlySalary / daysInMonth;
            const otHourlyRate = ((monthlySalary / 30) / 8) * 1.5;
            
            Object.keys(events).forEach(dateKey => {
                if (dateKey.startsWith(currentMonthPrefix)) {
                    events[dateKey].forEach(e => {
                        const otAmount = e.otHours ? otHourlyRate * e.otHours : 0;
                        monthlyOtHours += (e.otHours || 0);
                        if (e.income || e.amount) monthlyIncome += (e.income || e.amount || 0); // รองรับข้อมูลเก่า (amount)
                        monthlyIncome += otAmount;
                        if (e.expense) monthlyExpense += e.expense;
                    });
                }
            });

            // 2. อัปเดตส่วนหัวเดือน/ปี และยอดสรุปเดือน
            const totalMonthlyIncome = monthlyIncome + monthlySalary;
            const balanceClass = totalMonthlyIncome - monthlyExpense >= 0 
                ? 'bg-blue-50 text-blue-700 border-blue-100' 
                : 'bg-orange-50 text-orange-700 border-orange-100';

            document.getElementById('month-year-display').innerHTML = `
                <div class="w-full">
                    <h1 class="text-2xl font-bold text-slate-800">
                        ${THAI_MONTHS[month]} พ.ศ. ${year + 543}
                    </h1>
                    <p class="text-sm text-slate-500 font-medium">
                        ค.ศ. ${year}
                    </p>
                </div>
                <div class="mt-3 bg-white p-3 rounded-xl border border-slate-200 w-full shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-3 pb-3 border-b border-slate-100 gap-2">
                        <label class="text-sm font-bold text-slate-700">เงินเดือนประจำเดือนนี้:</label>
                        <div class="flex items-center">
                            <span class="text-slate-500 mr-2 text-sm font-bold">฿</span>
                            <input type="number" value="${monthlySalary || ''}" onchange="window.updateSalary(this.value)" class="w-full sm:w-28 p-1.5 border border-slate-300 rounded-lg focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 text-right text-sm font-semibold text-blue-700 transition-all bg-blue-50/30" placeholder="0.00">
                        </div>
                    </div>
                    <div class="flex gap-2 w-full flex-wrap">
                        <div class="text-xs md:text-sm bg-green-50 text-green-700 px-2 py-1.5 rounded-lg border border-green-200 flex items-center shadow-sm">
                            <span class="font-bold mr-1">รายรับ:</span> ฿${totalMonthlyIncome.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2})}
                        </div>
                        <div class="text-xs md:text-sm bg-red-50 text-red-700 px-2 py-1.5 rounded-lg border border-red-200 flex items-center shadow-sm">
                            <span class="font-bold mr-1">รายจ่าย:</span> ฿${monthlyExpense.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2})}
                        </div>
                        <div class="text-xs md:text-sm bg-purple-50 text-purple-700 px-2 py-1.5 rounded-lg border border-purple-200 flex items-center shadow-sm">
                            <span class="font-bold mr-1">โอทีรวม:</span> ${monthlyOtHours} ชม.
                        </div>
                        <div class="text-xs md:text-sm ${balanceClass} px-2 py-1.5 rounded-lg border flex items-center shadow-sm">
                            <span class="font-bold mr-1">คงเหลือ:</span> ฿${(totalMonthlyIncome - monthlyExpense).toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2})}
                        </div>
                    </div>
                </div>
            `;

            const firstDay = getFirstDayOfMonth(year, month);
            const calendarGrid = document.getElementById('calendar-grid');
            
            let html = '';
            
            // ช่องว่างก่อนวันแรกของเดือน
            for (let i = 0; i < firstDay; i++) {
                html += `<div class="p-2 md:p-4 border border-transparent"></div>`;
            }
            
            // วันที่ในเดือน
            for (let day = 1; day <= daysInMonth; day++) {
                const currentIterDate = new Date(year, month, day);
                const dateKey = formatDateKey(currentIterDate);
                
                const isToday = currentIterDate.toDateString() === today.toDateString();
                const isSelected = currentIterDate.toDateString() === selectedDate.toDateString();
                const dayEvents = events[dateKey] || [];
                const hasEvents = dayEvents.length > 0;
                
                let dayIncome = dailySalary; // นำเงินเดือนรายวันมาเป็นฐาน
                let dayExpense = 0;
                dayEvents.forEach(e => { 
                    const otAmount = e.otHours ? otHourlyRate * e.otHours : 0;
                    if (e.amount || e.income) dayIncome += (e.amount || e.income || 0);
                    dayIncome += otAmount;
                    if (e.expense) dayExpense += e.expense;
                });
                
                let baseClasses = "relative h-[4.5rem] sm:h-20 md:h-24 w-full p-1 md:p-2 border transition-all duration-200 flex flex-col items-start justify-start rounded-lg hover:shadow-md overflow-hidden focus:outline-none focus:ring-2 focus:ring-blue-300 ";
                baseClasses += isSelected ? "border-blue-500 bg-blue-50 z-10 shadow-sm" : "border-gray-100 hover:border-blue-300 bg-white";
                
                let numClasses = "text-sm md:text-base font-medium w-7 h-7 flex items-center justify-center rounded-full flex-shrink-0 ";
                if (isToday && !isSelected) numClasses += "bg-blue-600 text-white";
                else if (isSelected && isToday) numClasses += "bg-blue-700 text-white";
                else if (isSelected && !isToday) numClasses += "text-blue-700 font-bold";
                else numClasses += "text-gray-700";

                let eventsIndicator = '';
                if (hasEvents) {
                    const dots = dayEvents.slice(0, 3).map(() => 
                        `<div class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-blue-600' : 'bg-blue-400'}"></div>`
                    ).join('');
                    const plus = dayEvents.length > 3 ? `<span class="text-[10px] text-gray-500 leading-none">+</span>` : '';
                    eventsIndicator = `<div class="absolute bottom-1 md:bottom-2 left-1/2 transform -translate-x-1/2 flex space-x-1">${dots}${plus}</div>`;
                }

                let incomeIndicator = '';
                if (dayIncome > 0 || dayExpense > 0) {
                    incomeIndicator = `<div class="mt-auto w-full text-right text-[10px] md:text-xs font-semibold truncate hidden md:block space-y-0.5">`;
                    if (dayIncome > 0) incomeIndicator += `<div class="text-green-600 bg-green-50/50 rounded px-1">+฿${dayIncome.toLocaleString('th-TH')}</div>`;
                    if (dayExpense > 0) incomeIndicator += `<div class="text-red-500 bg-red-50/50 rounded px-1">-฿${dayExpense.toLocaleString('th-TH')}</div>`;
                    incomeIndicator += `</div>`;
                    
                    // สำหรับมือถือ แสดงเป็นจุดสี
                    incomeIndicator += `<div class="absolute top-1 right-1 flex space-x-0.5 md:hidden">`;
                    if (dayIncome > 0) incomeIndicator += `<div class="w-1.5 h-1.5 rounded-full bg-green-500"></div>`;
                    if (dayExpense > 0) incomeIndicator += `<div class="w-1.5 h-1.5 rounded-full bg-red-500"></div>`;
                    incomeIndicator += `</div>`;
                }

                html += `
                    <button onclick="window.selectDate(${year}, ${month}, ${day})" class="${baseClasses}">
                        <span class="${numClasses}">${day}</span>
                        ${incomeIndicator}
                        ${eventsIndicator}
                    </button>
                `;
            }
            
            calendarGrid.innerHTML = html;
        }

        function renderEvents() {
            // อัปเดตส่วนหัวของกิจกรรม
            document.getElementById('selected-date-header').innerHTML = `
                <div class="flex-1">
                    <h2 class="text-xl font-bold mb-1">${THAI_DAYS_FULL[selectedDate.getDay()]}</h2>
                    <p class="text-blue-100 font-medium text-lg">
                        ${selectedDate.getDate()} ${THAI_MONTHS[selectedDate.getMonth()]} ${selectedDate.getFullYear() + 543}
                    </p>
                </div>
                <button onclick="window.closeMobileModal()" class="lg:hidden p-2 text-white bg-blue-700 hover:bg-blue-800 rounded-lg transition-colors" aria-label="ปิด">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>

            // แสดง/ซ่อน ฟอร์มเพิ่มกิจกรรม

                formContainer.classList.add('hidden');

            // แสดงรายการกิจกรรม
            const selectedDateKey = formatDateKey(selectedDate);

            // คำนวณเงินเดือนรายวันของวันที่เลือก
            const selYear = selectedDate.getFullYear();
            const selMonth = selectedDate.getMonth();
            const selMonthKey = `${selYear}-${String(selMonth + 1).padStart(2, '0')}`;
            const selMonthlySalary = monthlySalaries[selMonthKey] || 0;
            const selDaysInMonth = getDaysInMonth(selYear, selMonth);
            const selDailySalary = selMonthlySalary / selDaysInMonth;
            const selOtHourlyRate = ((selMonthlySalary / 30) / 8) * 1.5;

            let totalIncome = selDailySalary;
            let totalExpense = 0;
            let dailyOtHours = 0;
            dayEvents.forEach(event => {
                const otAmount = event.otHours ? selOtHourlyRate * event.otHours : 0;
                dailyOtHours += (event.otHours || 0);
                if (event.amount || event.income) totalIncome += (event.amount || event.income || 0);
                totalIncome += otAmount;
                if (event.expense) totalExpense += event.expense;
            });

            // กล่องสรุปรายวัน
            let summaryHtml = '';
            if (totalIncome > 0 || totalExpense > 0 || dailyOtHours > 0) {
                let gridCols = 'grid-cols-2';
                if (dailyOtHours > 0) gridCols = 'grid-cols-3';
                else if (totalIncome === 0 || totalExpense === 0) gridCols = 'grid-cols-1';
                
                summaryHtml = `<div class="mb-4 grid ${gridCols} gap-3">`;
                
                if (totalIncome > 0) {
                    summaryHtml += `
                        <div class="p-3 bg-green-50 border border-green-200 rounded-xl shadow-sm flex flex-col justify-center items-center">
                            <span class="text-xs font-bold text-green-700 mb-1">รายรับวันนี้</span>
                            <span class="text-sm md:text-lg font-extrabold text-green-600">+฿${totalIncome.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                        </div>
                    `;
                }
                
                if (totalExpense > 0) {
                    summaryHtml += `
                        <div class="p-3 bg-red-50 border border-red-200 rounded-xl shadow-sm flex flex-col justify-center items-center">
                            <span class="text-xs font-bold text-red-700 mb-1">รายจ่ายวันนี้</span>
                            <span class="text-sm md:text-lg font-extrabold text-red-600">-฿${totalExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})}</span>
                        </div>
                    `;
                }

                if (dailyOtHours > 0) {
                    summaryHtml += `
                        <div class="p-3 bg-purple-50 border border-purple-200 rounded-xl shadow-sm flex flex-col justify-center items-center">
                            <span class="text-xs font-bold text-purple-700 mb-1">โอทีวันนี้</span>
                            <span class="text-sm md:text-lg font-extrabold text-purple-600">${dailyOtHours} ชม.</span>
                        </div>
                    `;
                }
                
                summaryHtml += `</div>`;
            }

            // บล็อกเงินเดือนรายวันอัตโนมัติ
            let autoSalaryHtml = '';
            if (selDailySalary > 0) {
                autoSalaryHtml = `
                    <div class="group p-4 bg-blue-50/40 rounded-xl shadow-sm border border-blue-100 flex items-start justify-between transition-all mb-3">
                        <div class="flex flex-col w-full pr-2">
                            <div class="flex justify-between items-start">
                                <span class="font-semibold text-blue-800 text-base">เงินเดือน (เฉลี่ยรายวัน)</span>
                                <span class="font-bold text-blue-600 text-sm bg-blue-100/50 px-2 py-0.5 rounded border border-blue-200">+฿${selDailySalary.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                            </div>
                            <div class="flex items-center text-blue-500 mt-1 text-xs">
                                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1.5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                                <span>ระบบแบ่งจ่ายจากเงินเดือน (฿${selMonthlySalary.toLocaleString('th-TH')}) หาร ${selDaysInMonth} วัน</span>
                            </div>
                        </div>
                    </div>
                `;
            }

            if (dayEvents.length === 0 && selDailySalary === 0) {
                eventsListContainer.innerHTML = `
                    <div class="text-center py-10 text-slate-400 flex flex-col items-center justify-center">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mb-3 opacity-20"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        <p>ไม่มีบันทึกในวันนี้</p>
                    </div>
                `;
            } else {
                eventsListContainer.innerHTML = summaryHtml + autoSalaryHtml + dayEvents.map(event => {
                    const otAmount = event.otHours ? selOtHourlyRate * event.otHours : 0;
                    const eventTotalIncome = (event.income || event.amount || 0) + otAmount;

                    // กำหนดป้ายกำกับเงิน (สีเขียวหรือแดง)
                    let amountBadge = '';
                    if (eventTotalIncome > 0) {
                        amountBadge = `<span class="font-bold text-green-600 text-sm bg-green-50 px-2 py-0.5 rounded border border-green-100">+฿${eventTotalIncome.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</span>`;
                    } else if (event.expense > 0) {
                        amountBadge = `<span class="font-bold text-red-600 text-sm bg-red-50 px-2 py-0.5 rounded border border-red-100">-฿${event.expense.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</span>`;
                    }

                    let otDetail = event.otHours ? `<span class="text-purple-600 ml-2 font-medium bg-purple-100/60 px-1.5 py-0.5 rounded text-xs border border-purple-200">โอที ${event.otHours} ชม. (+฿${otAmount.toLocaleString('th-TH', {minimumFractionDigits: 0, maximumFractionDigits: 2})})</span>` : '';

                    return `
                        <div class="group p-4 bg-white rounded-xl shadow-sm border border-slate-100 flex items-start justify-between hover:shadow-md hover:border-blue-100 transition-all">
                            <div class="flex flex-col w-full pr-2">
                                <div class="flex justify-between items-start">
                                    <span class="font-semibold text-slate-800 text-base">${event.title} ${otDetail}</span>
                                    ${amountBadge}
                                </div>
                                <div class="flex items-center text-slate-500 mt-1 text-sm">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1.5"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                                    <span>${event.time} น.</span>
                                </div>
                            </div>
                            <button onclick="window.deleteEvent('${event.id}')" class="p-2 text-slate-300 hover:text-red-500 hover:bg-red-50 rounded-lg opacity-0 group-hover:opacity-100 transition-all flex-shrink-0" aria-label="ลบกิจกรรม">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
                            </button>
                        </div>
                    `;
                }).join('');
            }
        }

        function updateUI() {
            renderCalendar();
            renderEvents();
            if (currentView === 'dashboard') {
                renderDashboard();
            }
        }

        // --- DASHBOARD FUNCTIONS ---
        window.switchView = (view) => {
            currentView = view;
            
            // สลับการแสดงผล Wrapper (สลับ grid และ hidden ให้ถูกต้องเพื่อเลี่ยงปัญหา tailwind)
            const calView = document.getElementById('calendar-view');
            const dashView = document.getElementById('dashboard-view');
            
            if (view === 'calendar') {
                calView.classList.remove('hidden');
                calView.classList.add('grid');
                dashView.classList.add('hidden');
                dashView.classList.remove('flex');
            } else {
                calView.classList.add('hidden');
                calView.classList.remove('grid');
                dashView.classList.remove('hidden');
                dashView.classList.add('flex');
            }
            
            // อัปเดตสไตล์ปุ่มแท็บ
            const tabCal = document.getElementById('tab-calendar');
            const tabDash = document.getElementById('tab-dashboard');
            
            const activeTabClass = 'flex-1 flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 px-2 py-2 md:px-6 md:py-2.5 rounded-xl font-bold transition-all bg-blue-600 text-white shadow-md text-xs md:text-base';
            const inactiveTabClass = 'flex-1 flex flex-col md:flex-row items-center justify-center gap-1 md:gap-2 px-2 py-2 md:px-6 md:py-2.5 rounded-xl font-bold transition-all bg-slate-50 md:bg-white text-slate-600 hover:bg-slate-100 shadow-sm border border-slate-200 text-xs md:text-base';

            if (view === 'calendar') {
                tabCal.className = activeTabClass;
                tabDash.className = inactiveTabClass;
            } else {
                tabDash.className = activeTabClass;
                tabCal.className = inactiveTabClass;
                renderDashboard();
            }
        };

        function renderDashboard() {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const daysInMonth = getDaysInMonth(year, month);
            const currentMonthPrefix = `${year}-${String(month + 1).padStart(2, '0')}`;
            
            // อัปเดตส่วนหัว
            document.getElementById('dash-month-year').innerText = `${THAI_MONTHS[month]} พ.ศ. ${year + 543}`;

            const monthlySalary = monthlySalaries[currentMonthPrefix] || 0;
            const dailySalary = monthlySalary / daysInMonth;
            const otHourlyRate = ((monthlySalary / 30) / 8) * 1.5;

            let totalIncome = monthlySalary;
            let totalExpense = 0;
            let totalOtHours = 0;
            
            const labels = [];
            const incomeData = [];
            const expenseData = [];
            let allExpensesThisMonth = [];

            for (let day = 1; day <= daysInMonth; day++) {
                labels.push(day.toString());
                
                const dateKey = `${currentMonthPrefix}-${String(day).padStart(2, '0')}`;
                const dayEvents = events[dateKey] || [];
                
                let dayIncome = dailySalary;
                let dayExpense = 0;
                
                dayEvents.forEach(e => {
                    const otAmount = e.otHours ? otHourlyRate * e.otHours : 0;
                    totalOtHours += (e.otHours || 0);

                    if (e.income || e.amount) dayIncome += (e.income || e.amount || 0);
                    dayIncome += otAmount;

                    if (e.expense) {
                        dayExpense += e.expense;
                        allExpensesThisMonth.push({ ...e, dateStr: `${day} ${THAI_MONTHS[month].substring(0,3)}.` });
                    }
                });
                
                incomeData.push(dayIncome);
                expenseData.push(dayExpense);
                
                // สรุปยอดรวม
                dayEvents.forEach(e => {
                    const otAmount = e.otHours ? otHourlyRate * e.otHours : 0;
                    if (e.income || e.amount) totalIncome += (e.income || e.amount || 0);
                    totalIncome += otAmount;
                    if (e.expense) totalExpense += e.expense;
                });
            }

            // อัปเดตตัวเลขการ์ด
            const balance = totalIncome - totalExpense;
            document.getElementById('dash-income').innerText = `฿${totalIncome.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-expense').innerText = `฿${totalExpense.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
            document.getElementById('dash-ot').innerText = `${totalOtHours} ชม.`;
            document.getElementById('dash-balance').innerText = `฿${balance.toLocaleString('th-TH', {minimumFractionDigits: 2})}`;
            
            const balanceCard = document.getElementById('dash-balance-card');
            const balanceText = document.getElementById('dash-balance');
            if (balance < 0) {
                balanceCard.className = 'bg-white p-6 rounded-2xl shadow-sm border border-red-100 border-l-4 border-l-red-500';
                balanceText.className = 'text-3xl font-extrabold text-red-600';
            } else {
                balanceCard.className = 'bg-white p-6 rounded-2xl shadow-sm border border-blue-100 border-l-4 border-l-blue-500';
                balanceText.className = 'text-3xl font-extrabold text-blue-600';
            }

            // แสดงรายจ่ายล่าสุด (เรียงจากล่าสุดไปเก่า)
            allExpensesThisMonth.reverse();
            const recentExpensesContainer = document.getElementById('dash-recent-expenses');
            if (allExpensesThisMonth.length === 0) {
                recentExpensesContainer.innerHTML = '<p class="text-slate-400 text-center py-4 text-sm">ไม่มีข้อมูลรายจ่ายในเดือนนี้</p>';
            } else {
                recentExpensesContainer.innerHTML = allExpensesThisMonth.slice(0, 10).map(exp => `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-100">
                        <div class="flex flex-col">
                            <span class="font-semibold text-slate-700 text-sm">${exp.title}</span>
                            <span class="text-xs text-slate-500">${exp.dateStr} • ${exp.time} น.</span>
                        </div>
                        <span class="font-bold text-red-600 text-sm">-฿${exp.expense.toLocaleString('th-TH')}</span>
                    </div>
                `).join('');
            }

            // สร้างและอัปเดตกราฟ Chart.js
            const ctx = document.getElementById('financeChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'รายรับ (รวมเฉลี่ยต่อวัน)', data: incomeData, backgroundColor: 'rgba(34, 197, 94, 0.7)', borderRadius: 4 },
                        { label: 'รายจ่าย', data: expenseData, backgroundColor: 'rgba(239, 68, 68, 0.7)', borderRadius: 4 }
                    ]
                },
                options: {
                    responsive: true, 
                    maintainAspectRatio: false,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        // Action Handlers
        window.closeMobileModal = () => {
            const backdrop = document.getElementById('mobile-modal-backdrop');
            const panel = document.getElementById('events-panel-container');
            if (backdrop && panel) {
                backdrop.classList.add('hidden');
                panel.classList.add('hidden');
                panel.classList.remove('flex');
            }
        };

        window.updateSalary = (val) => {
            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const monthKey = `${year}-${String(month + 1).padStart(2, '0')}`;
            monthlySalaries[monthKey] = parseFloat(val) || 0;
            updateUI();
            syncToCloud(); // บันทึกเงินเดือนใหม่ขึ้นคลาวด์
        };

        window.prevMonth = () => {
            viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() - 1, 1);
            updateUI();
        };

        window.nextMonth = () => {
            viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth() + 1, 1);
            updateUI();
        };

        window.goToToday = () => {
            const now = new Date();
            viewDate = new Date(now.getFullYear(), now.getMonth(), 1);
            selectedDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            showAddEvent = false;
            updateUI();
        };

        window.selectDate = (year, month, day) => {
            selectedDate = new Date(year, month, day);
            showAddEvent = false;
            updateUI();

            // แสดง Popup ในมือถือ (หน้าจอกว้างน้อยกว่า 1024px)
            if (window.innerWidth < 1024) {
                const backdrop = document.getElementById('mobile-modal-backdrop');
                const panel = document.getElementById('events-panel-container');
                if (backdrop && panel) {
                    backdrop.classList.remove('hidden');
                    panel.classList.remove('hidden');
                    panel.classList.add('flex');
                }
            }
        };

        window.toggleAddEvent = () => {
            showAddEvent = !showAddEvent;
            renderEvents();
        };

        window.submitEvent = (e) => {
            e.preventDefault();
            const titleInput = document.getElementById('event-title');
            const timeInput = document.getElementById('event-time');
            const incomeInput = document.getElementById('event-income');
            const expenseInput = document.getElementById('event-expense');
            const otInput = document.getElementById('event-ot');
            
            const title = titleInput.value.trim();
            const time = timeInput.value;
            const income = incomeInput.value ? parseFloat(incomeInput.value) : 0;
            const expense = expenseInput.value ? parseFloat(expenseInput.value) : 0;
            const otHours = otInput && otInput.value ? parseFloat(otInput.value) : 0;
            
            if (!title) return;

            const dateKey = formatDateKey(selectedDate);
            const newEvent = {
                id: Date.now().toString(),
                title: title,
                time: time,
                income: income,
                expense: expense,
                otHours: otHours
            };

            if (!events[dateKey]) events[dateKey] = [];
            events[dateKey].push(newEvent);
            
            // เรียงตามเวลา
            events[dateKey].sort((a, b) => a.time.localeCompare(b.time));

            // เคลียร์ฟอร์ม
            titleInput.value = '';
            if(incomeInput) incomeInput.value = '';
            if(expenseInput) expenseInput.value = '';
            if(otInput) otInput.value = '';
            
            showAddEvent = false;
            updateUI();
            syncToCloud(); // บันทึกกิจกรรมขึ้นคลาวด์
        };

        window.deleteEvent = (eventId) => {
            const dateKey = formatDateKey(selectedDate);
            if (events[dateKey]) {
                events[dateKey] = events[dateKey].filter(event => event.id !== eventId);
                updateUI();
                syncToCloud(); // บันทึกการลบขึ้นคลาวด์
            }
        };

        // Initialize App
        renderHeader();
        updateUI();
        
        // หากมี URL เซฟไว้อยู่แล้ว ให้ดึงข้อมูลมาแสดงทันที
        if (scriptUrl && scriptUrl.startsWith('http') && !scriptUrl.includes('...')) {
            loadFromCloud();
        }
    </script>
</body>
</html>
